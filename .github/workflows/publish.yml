name: Publish

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Publish the current version, or bump it first'
        required: true
        default: current
        type: choice
        options:
          - current
          - patch
          - minor

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Qrysto/skills' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Ensure npm supports trusted publishing
        run: npm install --global npm@11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          if [ "$BUMP" != current ]; then
            npm version "$BUMP" --no-git-tag-version
          fi
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          const { name, version } = JSON.parse(readFileSync('package.json', 'utf8'));
          if (name !== '@krysto/skills') throw new Error('Unexpected package name');
          if (!/^\d+\.\d+\.\d+$/.test(version)) throw new Error('Expected a stable version');
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\ntag=krysto-v${version}\n`);
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # The fork uses the Actions identity rather than upstream signing secrets.
          if ! git diff --quiet -- package.json; then
            git add package.json
            git commit -m "Release @krysto/skills"
          fi

      - name: Type check
        run: pnpm type-check

      - name: Check formatting
        run: pnpm format:check

      - name: Build selected version
        run: pnpm build

      - name: Tests
        run: pnpm exec vitest run

      - name: Check packed package
        run: pnpm test:e2e package.e2e.ts

      - name: Check release tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            echo "Release tag $TAG already exists. Choose a new version."
            exit 1
          fi

      - name: Push validated release commit
        # Preserve the exact version commit for retry/recovery before uploading.
        run: git push origin HEAD:main

      - name: Publish to npm
        # npm exchanges the GitHub OIDC token; no npm token secret is required.
        run: npm publish --provenance --access public

      - name: Push release tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git tag "$TAG"
          git push origin "refs/tags/$TAG"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" --generate-notes --title "@krysto/skills ${TAG#krysto-v}"
